<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Control Center — MyPepTraX</title>
<!--
  MyPepTraX Control Center.

  SECURITY MODEL, stated plainly because the obvious implementation of an
  "admin-only link" is the dangerous one:

  1. This page is PUBLIC. The URL is not the security boundary and must never
     be treated as a secret - links are shared, logged and kept in history.
  2. The key below is the ANON key, published inside every copy of the iOS app.
     It grants nothing on its own.
  3. Authority comes from signing in and from row-level security. A non-admin
     session sees an empty console because the policies return nothing, not
     because the interface hid it.
  4. There is NO service-role key here and there must never be one. In a browser
     it bypasses every policy and hands the database to anyone viewing source.

  Scope is deliberately narrower than the sidebar of a typical admin tool: no
  user list, no activity feed, no reading anybody's log. See "What this can see".
-->
<style>
:root{--bg:#0a0e10;--panel:#12181b;--card:#161d21;--ink:#eef2f3;--muted:#8b979f;
--accent:#2ec4b0;--danger:#ef6b62;--warn:#e0a458;--ok:#3ecf8e;--line:#222b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 20px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);
display:grid;place-items:center;font-weight:800;color:#04120f}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;
padding:10px 12px;margin-bottom:2px;border:0;border-radius:9px;background:transparent;
color:var(--muted);font-size:14px;cursor:pointer}
nav button:hover{background:#1a2226;color:var(--ink)}
nav button.on{background:#132a27;color:var(--ink);box-shadow:inset 0 0 0 1px #1d4740}
nav .count{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;
background:var(--danger);color:#fff}
main{padding:26px 28px 80px;max-width:1100px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--danger)} .stat.good b{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
color:var(--muted);font-weight:600;padding:0 10px 8px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.bad{background:var(--danger);color:#fff}
.pill.warn{background:var(--warn);color:#1a1205}
button.act{padding:7px 11px;border-radius:8px;border:1px solid var(--line);
background:transparent;color:var(--ink);font-size:13px;cursor:pointer;margin-right:6px}
button.act.primary{background:var(--accent);border-color:var(--accent);color:#04120f;font-weight:600}
button.act.bad{background:var(--danger);border-color:var(--danger);color:#fff}
select{padding:7px 9px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.snap{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;
margin:8px 0;white-space:pre-wrap;font-size:13px;max-height:180px;overflow:auto}
code{font-size:12px;color:var(--muted);word-break:break-all}
.signin{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);
border-radius:14px;padding:26px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
background:var(--bg);color:var(--ink);font-size:15px}
.hide{display:none!important}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}
nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}}
</style>
</head>
<body>

<div class="signin" id="auth">
  <div class="brand"><div class="mark">M</div>
    <div><b>MyPepTraX</b><span>Control Center</span></div></div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" inputmode="email">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <p><button class="act primary" id="signin" style="width:100%;padding:11px">Sign in</button></p>
  <p class="muted">Access is granted by the database, not by this page.</p>
  <p class="err hide" id="authErr"></p>
</div>

<div class="shell hide" id="shell">
  <aside>
    <div class="brand"><div class="mark">M</div>
      <div><b>MyPepTraX</b><span>Control Center</span></div></div>
    <nav id="nav"></nav>
    <p class="muted" style="padding:14px 12px 0" id="signedInAs"></p>
    <p style="padding:0 12px">
      <button class="act" id="refresh">Refresh</button>
      <button class="act" id="signout">Sign out</button>
    </p>
  </aside>
  <div>
    <p class="err hide" id="metricsErr" style="padding:26px 28px 0"></p>
    <main id="main"></main>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const db = createClient("https://kvseispfcfqvvgbdvfxm.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2c2Vpc3BmY2ZxdnZnYmR2ZnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjEwNTUsImV4cCI6MjEwMDUzNzA1NX0.CIUtuRVHR9J-gu92kYSHlZE51vkFeyybJzVo2oK6Zik");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => t ? new Date(t).toLocaleString() : "—";

const REASONS = {
  human_use: "Describes taking it themselves", dosing_advice: "Telling someone what to take",
  sourcing: "Selling or sourcing", medical_claim: "Unsupported medical claim",
  harassment: "Harassment or abuse", spam: "Spam", minor: "Involves a minor", other: "Something else",
};
const URGENT = new Set(["human_use", "minor"]);
const BUG_STATUSES = ["open", "investigating", "fixed", "wontfix"];

const SECTIONS = [
  { id: "dashboard",  label: "Dashboard",   render: renderDashboard },
  { id: "activity",   label: "Live Activity", render: renderActivity },
  { id: "users",      label: "Users",       render: renderUsers },
  { id: "subs",       label: "Subscriptions", render: renderSubs },
  { id: "reliability",label: "Reliability", render: renderReliability },
  { id: "support",    label: "Support",     render: renderSupport },
  { id: "moderation", label: "Moderation",  render: renderModeration },
  { id: "community",  label: "Community",   render: renderCommunity },
  { id: "emails",     label: "Emails",      render: renderEmails },
  { id: "access",     label: "What this can see", render: renderAccess },
];

let metrics = null;
let current = "dashboard";

// ---------------------------------------------------------------- auth ---

async function isAdmin() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return false;
  const { data } = await db.from("profiles").select("is_admin").eq("id", user.id).maybeSingle();
  return data?.is_admin === true;
}

async function signIn() {
  $("authErr").classList.add("hide");
  $("signin").disabled = true;
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("password").value,
  });
  $("signin").disabled = false;
  if (error) return fail(error.message);
  if (!(await isAdmin())) { await db.auth.signOut(); return fail("That account is not an administrator."); }
  await enter();
}

function fail(m) { $("authErr").textContent = m; $("authErr").classList.remove("hide"); }

async function enter() {
  const { data: { user } } = await db.auth.getUser();
  $("auth").classList.add("hide");
  $("shell").classList.remove("hide");
  $("signedInAs").textContent = user.email;
  buildNav();
  await refresh();
}

// ---------------------------------------------------------------- nav ---

function buildNav() {
  $("nav").innerHTML = SECTIONS.map((s) =>
    `<button data-id="${s.id}" class="${s.id === current ? "on" : ""}">
       <span>${esc(s.label)}</span><span class="count hide" id="badge-${s.id}"></span>
     </button>`).join("");
  for (const b of $("nav").querySelectorAll("button")) {
    b.onclick = () => { current = b.dataset.id; buildNav(); show(); };
  }
  badges();
}

function badges() {
  if (!metrics) return;
  const map = { moderation: metrics.open_reports, support: metrics.open_bugs };
  for (const [id, n] of Object.entries(map)) {
    const el = $(`badge-${id}`);
    if (!el) continue;
    el.textContent = n;
    el.classList.toggle("hide", !n);
  }
}

async function refresh() {
  const { data, error } = await db.rpc("admin_metrics");
  // A single row of totals. If the function is missing the console still works,
  // it just cannot show counts — better than a blank page.
  metrics = error ? null : (Array.isArray(data) ? data[0] : data);
  $("metricsErr").classList.toggle("hide", !error);
  if (error) $("metricsErr").textContent = `Counts unavailable: ${error.message}`;
  badges();
  await show();
}

async function show() {
  const section = SECTIONS.find((s) => s.id === current);
  $("main").innerHTML = `<h1>${esc(section.label)}</h1><p class="sub" id="sub"></p><div id="body"></div>`;
  await section.render();
}

// ----------------------------------------------------------- sections ---

function statCards(pairs) {
  return `<div class="cards">${pairs.map(([label, value, tone]) =>
    `<div class="stat ${tone || ""}"><b>${esc(value ?? "—")}</b><span>${esc(label)}</span></div>`
  ).join("")}</div>`;
}

async function renderDashboard() {
  $("sub").textContent = "Totals across the whole system. No individual record is read to produce these.";
  const m = metrics;
  $("body").innerHTML = statCards([
    ["Accounts", m?.accounts], ["New this week", m?.accounts_this_week],
    ["Completed setup", m?.onboarded],
    ["Open bugs", m?.open_bugs, m?.open_bugs ? "warn" : "good"],
    ["Crashes, 7d", m?.crashes_7d, m?.crashes_7d ? "bad" : "good"],
    ["Hangs, 7d", m?.hangs_7d, m?.hangs_7d ? "warn" : "good"],
    ["Open reports", m?.open_reports, m?.open_reports ? "warn" : "good"],
    ["Community handles", m?.community_handles],
  ]) + `<div class="panel"><h2>Health</h2><p class="muted">
    ${m ? (m.crashes_7d || m.open_bugs
        ? "Something needs attention — see Reliability and Support."
        : "No crashes and no open bug reports in the last seven days.")
        : "Counts are unavailable. Run migration 0022_admin_metrics.sql."}
  </p></div>`;
}

async function renderReliability() {
  $("sub").textContent = "Crashes and hangs from Apple's MetricKit, grouped. Anonymous by design — a crash needs no author to be fixable.";
  const { data, error } = await db.rpc("admin_crash_groups");
  if (error) return $("body").innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data?.length) return $("body").innerHTML = `<div class="panel"><p class="muted">No crashes or hangs recorded.</p></div>`;
  $("body").innerHTML = `<div class="panel"><table>
    <tr><th>Signature</th><th>Kind</th><th>Count</th><th>Version</th><th>Last seen</th></tr>
    ${data.map((r) => `<tr>
      <td><code>${esc(r.signature)}</code></td>
      <td><span class="pill ${r.kind === "crash" ? "bad" : "warn"}">${esc(r.kind)}</span></td>
      <td>${esc(r.occurrences)}</td><td>${esc(r.app_version)}</td><td>${esc(when(r.last_seen))}</td>
    </tr>`).join("")}
  </table></div>`;
}

async function renderSupport() {
  $("sub").textContent = "Bug reports sent from the app.";
  const { data, error } = await db.from("bug_reports").select("*")
    .order("created_at", { ascending: false }).limit(200);
  if (error) return $("body").innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data.length) return $("body").innerHTML = `<div class="panel"><p class="muted">No bug reports.</p></div>`;
  $("body").innerHTML = data.map((b) => `<div class="panel">
      <div style="display:flex;justify-content:space-between;gap:12px">
        <strong>${esc(b.summary)}</strong><span class="muted">${esc(when(b.created_at))}</span>
      </div>
      ${b.detail ? `<div class="snap">${esc(b.detail)}</div>` : ""}
      <p class="muted">v${esc(b.app_version)} · iOS ${esc(b.os_version)} · ${esc(b.device_model)}</p>
      <select id="bug-${b.id}">${BUG_STATUSES.map((s) =>
        `<option value="${s}" ${s === b.status ? "selected" : ""}>${s}</option>`).join("")}</select>
    </div>`).join("");
  for (const b of data) {
    const el = $(`bug-${b.id}`);
    if (el) el.onchange = async () => {
      const closed = el.value === "fixed" || el.value === "wontfix";
      const { error } = await db.from("bug_reports")
        .update({ status: el.value, resolved_at: closed ? new Date().toISOString() : null })
        .eq("id", b.id);
      if (error) alert(error.message);
      await refresh();
    };
  }
}

async function renderModeration() {
  $("sub").textContent = "Reported posts and replies, hidden from the feed until decided. Who reported is never fetched.";
  const { data, error } = await db.from("community_reports").select("*")
    .is("resolved_at", null).order("created_at", { ascending: false }).limit(200);
  if (error) return $("body").innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data.length) return $("body").innerHTML = `<div class="panel"><p class="muted">Nothing to review.</p></div>`;
  $("body").innerHTML = data.map((r) => `<div class="panel">
      <div style="display:flex;justify-content:space-between;gap:12px">
        <span class="pill ${URGENT.has(r.reason) ? "bad" : ""}">${esc(REASONS[r.reason] ?? r.reason)}</span>
        <span class="muted">${esc(when(r.created_at))}</span>
      </div>
      <div class="snap">${esc(r.content_snapshot || "No copy of the content was kept.")}</div>
      ${r.detail ? `<p class="muted">Reporter added: ${esc(r.detail)}</p>` : ""}
      <button class="act primary" id="ok-${r.id}">Approve and restore</button>
      <button class="act bad" id="rm-${r.id}">Deny and remove</button>
      <button class="act" id="sus-${r.id}" ${r.target_author_id ? "" : "disabled"}>Remove and suspend</button>
    </div>`).join("");
  for (const r of data) {
    $(`ok-${r.id}`).onclick = () => resolveReport(r, "approved");
    $(`rm-${r.id}`).onclick = () => resolveReport(r, "removed");
    const sus = $(`sus-${r.id}`); if (sus && !sus.disabled) sus.onclick = () => resolveReport(r, "suspended");
  }
}

async function resolveReport(report, resolution) {
  const label = { approved: "restore", removed: "remove", suspended: "remove and suspend the account" }[resolution];
  if (!confirm(`Are you sure you want to ${label}?`)) return;
  try {
    if (resolution !== "approved") {
      if (report.post_id) await db.from("community_posts").delete().eq("id", report.post_id);
      if (report.comment_id) await db.from("community_comments").delete().eq("id", report.comment_id);
    }
    if (resolution === "suspended" && report.target_author_id) {
      await db.from("community_profiles").update({ is_suspended: true }).eq("id", report.target_author_id);
    }
    if (resolution === "approved") {
      await db.rpc("community_set_review", {
        target_post: report.post_id, target_comment: report.comment_id, reviewing: false });
    }
    const { data: { user } } = await db.auth.getUser();
    const stored = resolution === "approved" ? "dismissed" : resolution;
    const { error } = await db.from("community_reports").update({
      resolved_at: new Date().toISOString(), resolved_by: user.id, resolution: stored }).eq("id", report.id);
    if (error) throw error;
  } catch (e) { alert(`That did not go through: ${e.message ?? e}`); }
  await refresh();
}

async function renderCommunity() {
  $("sub").textContent = "Posts as a moderator sees them, including anything currently under review.";
  const { data, error } = await db.from("community_posts").select("*")
    .order("created_at", { ascending: false }).limit(100);
  if (error) return $("body").innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data.length) return $("body").innerHTML = `<div class="panel"><p class="muted">No posts yet.</p></div>`;
  $("body").innerHTML = `<div class="panel"><table>
    <tr><th>Post</th><th>Category</th><th>Likes</th><th>Replies</th><th>Posted</th><th></th></tr>
    ${data.map((p) => `<tr>
      <td>${esc((p.title ? p.title + " — " : "") + p.body).slice(0, 180)}</td>
      <td>${esc(p.category)}</td><td>${esc(p.like_count)}</td><td>${esc(p.comment_count)}</td>
      <td>${esc(when(p.created_at))}</td>
      <td>${p.under_review ? '<span class="pill warn">under review</span>' : ""}</td>
    </tr>`).join("")}
  </table></div>`;
}

async function renderAccess() {
  $("sub").textContent = "What this console can and cannot reach, and why.";
  $("body").innerHTML = `
    <div class="panel"><h2>It can read</h2><p class="muted">
      Account identity and state — email, when somebody signed up and last
      signed in, whether they confirmed their address, whether they are banned
      or suspended, and what their app last reported about their subscription.
      Plus bug reports, crash diagnostics, community content, the moderation
      queue and system totals.
    </p></div>
    <div class="panel"><h2>It cannot read</h2><p class="muted">
      Anybody's dose log, vials, protocols, measurements, bloodwork, journal or
      photos. Those row-level security policies scope every row to its owner and
      have not been changed. The privacy policy tells users there is no admin
      screen that displays their records, and this console is built so that stays
      true rather than relying on nobody adding one.
    </p></div>
    <div class="panel"><h2>How that is possible without the health data</h2><p class="muted">
      Every query here goes through a function that chooses its own columns.
      Granting an admin <code>select</code> on <code>profiles</code> would have
      been simpler and would also have handed over every date of birth, sex and
      height, because row-level security is row-level and cannot withhold a
      column. The functions return identity and account state and nothing else,
      so there is no screen — and no query — that reaches a dose, a vial, a
      measurement or a photo.
    </p></div>
    <div class="panel"><h2>How access is granted</h2><p class="muted">
      This page is public and its URL is not a secret. The key it carries is the
      anon key, published inside every copy of the app. Authority comes from
      signing in: every query runs as that user, and a non-admin sees nothing
      because the policies return nothing. There is no service-role key here.
    </p></div>`;
}


let usersCache = [];

async function loadUsers(search) {
  const { data, error } = await db.rpc("admin_users", { search: search || null });
  if (error) throw error;
  usersCache = data ?? [];
  return usersCache;
}

async function renderUsers() {
  $("sub").textContent = "Every account, with what an operator needs to support or remove it. No health data is reachable here.";
  $("body").innerHTML = `
    <div class="panel">
      <input id="userSearch" placeholder="Search by email" style="max-width:320px">
    </div>
    <div id="userTable"><p class="muted">Loading…</p></div>`;
  $("userSearch").oninput = debounce(() => drawUsers($("userSearch").value), 300);
  await drawUsers("");
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

async function drawUsers(search) {
  let rows;
  try { rows = await loadUsers(search); }
  catch (e) { return $("userTable").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  if (!rows.length) return $("userTable").innerHTML = `<div class="panel"><p class="muted">No accounts match.</p></div>`;

  $("userTable").innerHTML = `<div class="panel"><table>
    <tr><th>Email</th><th>Joined</th><th>Last seen</th><th>State</th><th>Plan</th><th>Actions</th></tr>
    ${rows.map((u) => `<tr>
      <td>${esc(u.email)}${u.handle ? `<br><span class="muted">@${esc(u.handle)}</span>` : ""}</td>
      <td class="muted">${esc(shortDate(u.created_at))}</td>
      <td class="muted">${esc(shortDate(u.last_sign_in_at))}</td>
      <td>${statePills(u)}</td>
      <td>${u.subscription_status === "premium"
            ? '<span class="pill" style="background:#123;color:var(--accent)">premium</span>'
            : '<span class="pill">free</span>'}</td>
      <td>
        <button class="act" id="ban-${u.id}">${u.is_banned ? "Unban" : "Ban"}</button>
        <button class="act" id="sus-${u.id}" ${u.handle ? "" : "disabled"}>${u.community_suspended ? "Unsuspend" : "Suspend"}</button>
        <button class="act" id="adm-${u.id}">${u.is_admin ? "Revoke admin" : "Make admin"}</button>
        <button class="act bad" id="del-${u.id}">Delete</button>
      </td></tr>`).join("")}
  </table>
  <p class="muted" style="margin-top:12px">Plan is what the app last reported from StoreKit. It is a support hint, not the entitlement — the device decides what is unlocked.</p>
  </div>`;

  for (const u of rows) {
    $(`ban-${u.id}`).onclick = () => setFlag(u, "is_banned", !u.is_banned);
    const sus = $(`sus-${u.id}`);
    if (sus && !sus.disabled) sus.onclick = () => setFlag(u, "community_suspended", !u.community_suspended);
    $(`adm-${u.id}`).onclick = () => setFlag(u, "is_admin", !u.is_admin);
    $(`del-${u.id}`).onclick = () => deleteUser(u);
  }
}

function statePills(u) {
  const out = [];
  if (!u.email_confirmed) out.push('<span class="pill warn">unconfirmed</span>');
  if (u.is_banned) out.push('<span class="pill bad">banned</span>');
  if (u.community_suspended) out.push('<span class="pill warn">suspended</span>');
  if (u.is_admin) out.push('<span class="pill" style="background:#123;color:var(--accent)">admin</span>');
  if (!u.onboarded) out.push('<span class="pill">setup incomplete</span>');
  return out.join(" ") || '<span class="muted">—</span>';
}

const shortDate = (t) => t ? new Date(t).toLocaleDateString() : "never";

async function setFlag(user, flag, value) {
  const verb = { is_banned: value ? "ban" : "unban",
                 community_suspended: value ? "suspend" : "unsuspend",
                 is_admin: value ? "make an administrator" : "revoke administrator from" }[flag];
  if (!confirm(`${verb.charAt(0).toUpperCase() + verb.slice(1)} ${user.email}?`)) return;
  const { error } = await db.rpc("admin_set_flag", { target: user.id, flag, value });
  if (error) alert(error.message);
  await drawUsers($("userSearch")?.value ?? "");
  await refreshMetricsOnly();
}

async function deleteUser(user) {
  // Twice, because it cascades through every table the account touches and
  // there is nothing to restore from.
  if (!confirm(`Delete ${user.email}? This removes the account and everything in it.`)) return;
  if (!confirm("This cannot be undone. Delete permanently?")) return;
  const { error } = await db.rpc("admin_delete_user", { target: user.id });
  if (error) alert(error.message);
  await drawUsers($("userSearch")?.value ?? "");
  await refreshMetricsOnly();
}

async function renderActivity() {
  $("sub").textContent = "System events, newest first. Deliberately excludes anything somebody recorded about themselves.";
  const { data, error } = await db.rpc("admin_activity", { limit_rows: 150 });
  if (error) return $("body").innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data?.length) return $("body").innerHTML = `<div class="panel"><p class="muted">Nothing yet.</p></div>`;
  const tone = { crash: "bad", report: "warn", bug: "warn", signup: "", post: "" };
  $("body").innerHTML = `<div class="panel"><table>
    <tr><th>When</th><th>Event</th><th>Detail</th></tr>
    ${data.map((e) => `<tr>
      <td class="muted" style="white-space:nowrap">${esc(when(e.occurred_at))}</td>
      <td><span class="pill ${tone[e.kind] ?? ""}">${esc(e.kind)}</span></td>
      <td>${esc(e.detail ?? "")}</td>
    </tr>`).join("")}
  </table>
  <p class="muted" style="margin-top:12px">No dose, vial, measurement or bloodwork event appears here. A feed of those is a feed of health events, and no operator should be watching one.</p>
  </div>`;
}

async function renderSubs() {
  $("sub").textContent = "What each app last reported from StoreKit.";
  let rows;
  try { rows = await loadUsers(null); }
  catch (e) { return $("body").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  const premium = rows.filter((u) => u.subscription_status === "premium");
  const free = rows.filter((u) => u.subscription_status === "free");
  const unknown = rows.filter((u) => !u.subscription_status);
  $("body").innerHTML = statCards([
    ["Premium", premium.length, premium.length ? "good" : ""],
    ["Free", free.length],
    ["Not yet reported", unknown.length],
  ]) + `<div class="panel">
    <h2>Premium accounts</h2>
    ${premium.length ? `<table><tr><th>Email</th><th>Last reported</th></tr>
      ${premium.map((u) => `<tr><td>${esc(u.email)}</td><td class="muted">${esc(shortDate(u.created_at))}</td></tr>`).join("")}
    </table>` : `<p class="muted">Nobody has reported an active subscription yet.</p>`}
  </div>
  <div class="panel"><h2>Why this is a hint, not the truth</h2><p class="muted">
    StoreKit is the authority on entitlement and it lives on the device. This
    column is whatever the app last managed to write, so an account that has not
    opened the app since subscribing will read as stale, and one that never
    reached the network will read as unknown. It answers "is this person
    subscribed?" in a support thread. It must never be what unlocks a feature —
    if it were, a network write would decide what the app does.
    The authoritative record is App Store Connect.
  </p></div>`;
}

async function renderEmails() {
  $("sub").textContent = "Not available from here, and worth explaining rather than faking.";
  $("body").innerHTML = `
    <div class="panel"><h2>Sent email</h2><p class="muted">
      Confirmations, password resets and address changes are sent by Supabase
      through Resend. Their delivery status — sent, bounced, opened — lives in
      Resend, and reading it needs a Resend API key. A key with that power in a
      public web page would be readable by anyone who viewed source, so this
      console does not carry one and should not.
    </p>
    <p><a href="https://resend.com/emails" target="_blank" rel="noopener">Open Resend logs</a>
       · <a href="https://supabase.com/dashboard/project/kvseispfcfqvvgbdvfxm/logs/auth-logs" target="_blank" rel="noopener">Supabase auth logs</a></p>
    </div>
    <div class="panel"><h2>Received email</h2><p class="muted">
      Nothing in the app receives email. Users reach you through Report a bug,
      which appears under Support in this console. If you want a real inbox, the
      honest way is a support address with a shared mailbox — adding one here
      would mean putting mail credentials in a public page.
    </p></div>`;
}

async function refreshMetricsOnly() {
  const { data, error } = await db.rpc("admin_metrics");
  metrics = error ? null : (Array.isArray(data) ? data[0] : data);
  badges();
}

// -------------------------------------------------------------- start ---

$("signin").onclick = signIn;
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
$("refresh").onclick = refresh;
$("signout").onclick = async () => { await db.auth.signOut(); location.reload(); };

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session && await isAdmin()) await enter();
})();
</script>
